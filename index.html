<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="manifest" href="/manifest.json">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>RouteBuddy Live - Fullscreen Navigation</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body, html { height: 100%; margin: 0; padding: 0; background-color: #0f172a; overflow: hidden; font-family: system-ui, -apple-system, sans-serif; }
        #map { height: 100vh; width: 100vw; position: absolute; top: 0; left: 0; z-index: 1; }
        .moving-marker {
            background: #ffffff;
            border: 3px solid #2563eb;
            border-radius: 50%;
            box-shadow: 0 0 15px rgba(0,0,0,0.8);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
        }
        @keyframes loadLine {
            from { width: 0%; }
            to { width: 100%; }
        }
        /* Glassmorphism Floating UI Elements */
        .glass-panel {
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
    </style>
</head>
<body class="text-white">

    <!-- Premium Dark Splash / Welcome Screen -->
    <div id="welcome-screen" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #0b0f19; display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 999999; transition: opacity 0.8s ease;">
        <img src="https://i.postimg.cc/wBRs4cyt/IMG-20260814-WA0002.jpg" alt="Logo" style="width: 100px; height: 100px; border-radius: 24px; margin-bottom: 20px; box-shadow: 0 8px 25px rgba(0,0,0,0.7); border: 2px solid #2563eb;">
        <h1 style="color: #ffffff; font-size: 24px; font-weight: bold; margin: 0;">Route Buddy Live</h1>
        <p style="color: #38bdf8; font-size: 13px; margin: 6px 0 25px 0;">Next-Gen Live Navigation</p>
        <div style="width: 160px; height: 4px; background: #1e293b; border-radius: 2px; overflow: hidden;">
            <div style="height: 100%; background: #22c55e; width: 0%; animation: loadLine 2s forwards;"></div>
        </div>
        <p style="position: absolute; bottom: 35px; color: #64748b; font-size: 11px; font-weight: 500;">By Eagle Network Sbz</p>
    </div>

    <!-- FULL SCREEN MAP -->
    <div id="map"></div>

    <!-- TOP FLOATING BAR (Search & Area Name) -->
    <div class="absolute top-3 left-3 right-3 z-10 flex flex-col space-y-2">
        <div class="glass-panel p-2.5 rounded-2xl shadow-2xl flex items-center space-x-2">
            <button onclick="toggleMenu()" class="text-slate-300 hover:text-white p-1 focus:outline-none">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
            </button>
            <input type="text" id="destinationInput" placeholder="Search destination or place..." class="w-full bg-transparent text-white text-sm focus:outline-none px-1 placeholder-slate-400">
            <button onclick="searchDestination()" class="bg-blue-600 hover:bg-blue-700 text-xs px-3 py-2 rounded-xl font-semibold transition">🔍</button>
        </div>

        <!-- Live Area Name Card -->
        <div id="area-card" class="glass-panel px-3 py-1.5 rounded-xl shadow-lg flex items-center justify-between text-xs text-slate-300">
            <span class="flex items-center space-x-1.5">
                <span class="w-2 h-2 rounded-full bg-emerald-500 animate-ping"></span>
                <span>Current Area: <strong id="current-area-name" class="text-emerald-400">Locating area...</strong></span>
            </span>
            <span id="gps-status" class="text-[10px] bg-emerald-950 text-emerald-300 px-2 py-0.5 rounded-full border border-emerald-500/30">GPS Ready</span>
        </div>
    </div>

    <!-- SIDE MENU DRAWER (Hidden by default) -->
    <div id="sideMenu" class="absolute top-16 left-3 z-20 hidden glass-panel p-3 rounded-2xl shadow-2xl w-48 text-xs">
        <p class="font-bold text-emerald-400 mb-2">⚙️ Menu Options</p>
        <ul class="space-y-2 text-slate-300">
            <li class="cursor-pointer hover:text-white" onclick="alert('RouteBuddy Live v1.2\nBy Eagle Network Sbz')">ℹ️ About App</li>
            <li class="cursor-pointer hover:text-white" onclick="resetTrackingData()">🔄 Reset App Data</li>
        </ul>
    </div>

    <!-- BOTTOM FLOATING DASHBOARD (Circular & Modern UI) -->
    <div class="absolute bottom-4 left-3 right-3 z-10 flex flex-col space-y-2">
        
        <!-- Stats Floating Pill -->
        <div class="glass-panel p-3 rounded-2xl shadow-2xl grid grid-cols-2 gap-2 text-center">
            <div class="border-r border-slate-700/60">
                <span class="text-[10px] text-slate-400 uppercase tracking-wider block">Distance Covered</span>
                <strong id="total-distance" class="text-base text-emerald-400 font-bold">0.00 km</strong>
            </div>
            <div>
                <span class="text-[10px] text-slate-400 uppercase tracking-wider block">Speed</span>
                <strong id="current-speed" class="text-base text-sky-400 font-bold">0 km/h</strong>
            </div>
        </div>

        <!-- Circular Action Buttons Row -->
        <div class="flex items-center justify-between space-x-2">
            <button onclick="startTracking()" class="flex-1 bg-emerald-600 hover:bg-emerald-700 text-white py-3 px-4 rounded-2xl font-bold shadow-xl text-xs flex items-center justify-center space-x-1 transition active:scale-95">
                <span>📍</span> <span>Start Track</span>
            </button>
            <button onclick="stopTracking()" class="flex-1 bg-red-600 hover:bg-red-700 text-white py-3 px-4 rounded-2xl font-bold shadow-xl text-xs flex items-center justify-center space-x-1 transition active:scale-95">
                <span>🛑</span> <span>Stop</span>
            </button>
            <button onclick="shareApp()" class="bg-slate-800 hover:bg-slate-700 border border-slate-700 text-white p-3 rounded-2xl shadow-xl text-xs flex items-center justify-center transition active:scale-95" title="Share">
                <span>🔗</span>
            </button>
        </div>

        <!-- Tiny Footer Ad / Branding Inside Floating Area -->
        <div class="text-center text-[10px] text-slate-400 pt-1">
            <span>RouteBuddy Live © 2026 • Powered by Eagle Network Sbz</span>
        </div>
    </div>

    <!-- Leaflet JS & App Logic -->
    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
    <script>
        // Hide Splash Screen smoothly
        window.addEventListener('load', function() {
            setTimeout(function() {
                const splash = document.getElementById('welcome-screen');
                splash.style.opacity = '0';
                setTimeout(() => splash.style.display = 'none', 800);
            }, 2000);
        });

        function toggleMenu() {
            document.getElementById('sideMenu').classList.toggle('hidden');
        }

        // Initialize High-Res Clean Map (CartoDB Voyager for crisp, clean look)
        const map = L.map('map', { zoomControl: false }).setView([28.6139, 77.2090], 16);
        L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
            maxZoom: 20,
            subdomains: 'abcd',
            attribution: ''
        }).addTo(map);

        const personIcon = L.divIcon({
            className: 'moving-marker',
            html: '🚶‍♂️',
            iconSize: [40, 40],
            iconAnchor: [20, 20]
        });

        let latlngs = [];
        let totalDistance = 0;
        let routeLine = L.polyline([], {color: '#2563eb', weight: 6, opacity: 0.8}).addTo(map);
        let watchId = null;
        let userMarker = null;
        let destMarker = null;

        // Load previous data if exists
        const savedData = localStorage.getItem('routebuddy_live_path');
        if (savedData) {
            try {
                latlngs = JSON.parse(savedData);
                if (latlngs.length > 0) {
                    routeLine.setLatLngs(latlngs);
                    totalDistance = parseFloat(localStorage.getItem('routebuddy_live_distance') || '0');
                    document.getElementById('total-distance').innerText = totalDistance.toFixed(2) + ' km';
                    map.setView(latlngs[latlngs.length - 1], 17);
                    userMarker = L.marker(latlngs[latlngs.length - 1], { icon: personIcon }).addTo(map);
                }
            } catch(e) {}
        }

        function calculateDistance(lat1, lon1, lat2, lon2) {
            const R = 6371;
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLon = (lon2 - lon1) * Math.PI / 180;
            const a = Math.sin(dLat/2) * Math.sin(dLat/2) + Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * Math.sin(dLon/2) * Math.sin(dLon/2);
            return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
        }

        // Reverse Geocoding to get real-time Area / Street Name
        function updateAreaName(lat, lon) {
            fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lon}&zoom=16`)
                .then(res => res.json())
                .then(data => {
                    if (data && data.address) {
                        const road = data.address.road || data.address.suburb || data.address.neighbourhood || data.address.city || "Current Location";
                        const city = data.address.city || data.address.state_district || "";
                        document.getElementById('current-area-name').innerText = road + (city ? ", " + city : "");
                    }
                }).catch(e => {});
        }

        function startTracking() {
            if (navigator.geolocation) {
                document.getElementById('gps-status').innerText = "Tracking Live";
                document.getElementById('gps-status').className = "text-[10px] bg-emerald-500 text-black font-bold px-2 py-0.5 rounded-full animate-pulse";
                
                watchId = navigator.geolocation.watchPosition(
                    (pos) => {
                        const lat = pos.coords.latitude;
                        const lng = pos.coords.longitude;
                        let speedMs = pos.coords.speed;
                        let speedKmh = (speedMs && speedMs > 0.2) ? (speedMs * 3.6).toFixed(1) : 0;
                        const newLatLng = [lat, lng];

                        if (latlngs.length > 0) {
                            const lastPoint = latlngs[latlngs.length - 1];
                            const dist = calculateDistance(lastPoint[0], lastPoint[1], lat, lng);
                            if (dist > 0.0005) {
                                totalDistance += dist;
                                latlngs.push(newLatLng);
                                localStorage.setItem('routebuddy_live_path', JSON.stringify(latlngs));
                                localStorage.setItem('routebuddy_live_distance', totalDistance);
                            }
                        } else {
                            latlngs.push(newLatLng);
                        }

                        document.getElementById('total-distance').innerText = totalDistance.toFixed(2) + ' km';
                        document.getElementById('current-speed').innerText = speedKmh + ' km/h';

                        map.setView(newLatLng, 17);
                        routeLine.setLatLngs(latlngs);

                        if (userMarker) {
                            userMarker.setLatLng(newLatLng);
                        } else {
                            userMarker = L.marker(newLatLng, { icon: personIcon }).addTo(map);
                        }

                        // Fetch area name periodically
                        updateAreaName(lat, lng);
                    },
                    (err) => alert("GPS Error: " + err.message),
                    { enableHighAccuracy: true, maximumAge: 0, timeout: 15000 }
                );
            } else {
                alert("Geolocation is not supported by your browser.");
            }
        }

        function stopTracking() {
            if (watchId !== null) {
                navigator.geolocation.clearWatch(watchId);
                watchId = null;
                document.getElementById('gps-status').innerText = "Paused";
                document.getElementById('gps-status').className = "text-[10px] bg-amber-500 text-black font-bold px-2 py-0.5 rounded-full";
                alert("Tracking paused.");
            }
        }

        function resetTrackingData() {
            localStorage.removeItem('routebuddy_live_path');
            localStorage.removeItem('routebuddy_live_distance');
            location.reload();
        }

        function searchDestination() {
            const query = document.getElementById('destinationInput').value;
            if(!query) return alert("Please enter a destination name!");

            fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query)}`)
                .then(response => response.json())
                .then(data => {
                    if (data && data.length > 0) {
                        const destLatLng = [data[0].lat, data[0].lon];
                        map.setView(destLatLng, 15);
                        
                        if (destMarker) {
                            destMarker.setLatLng(destLatLng);
                        } else {
                            destMarker = L.marker(destLatLng, {
                                icon: L.icon({
                                    iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-red.png',
                                    shadowUrl: 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.7.1/images/marker-shadow.png',
                                    iconSize: [25, 41],
                                    iconAnchor: [12, 41]
                                })
                            }).addTo(map);
                        }
                    } else {
                        alert("Destination not found.");
                    }
                });
        }

        function shareApp() {
            if (navigator.share) {
                navigator.share({ title: 'RouteBuddy Live', url: window.location.href });
            } else {
                alert("Link copied / URL: " + window.location.href);
            }
        }
    </script>
</body>
</html>
