<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RouteBuddy - Your Journey, Your Guide</title>
    <link rel="manifest" href="manifest.json">
    <!-- Leaflet Map CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        #map { height: 300px; width: 100%; border-radius: 12px; }
    </style>
</head>
<body class="bg-slate-900 text-white min-h-screen flex flex-col justify-between p-3">

    <!-- Header with Logo, Name, Language Selector & Share Button -->
    <header class="bg-slate-800 border border-slate-700 p-3 rounded-2xl shadow-lg flex justify-between items-center mb-3">
        <div class="flex items-center space-x-2">
            <!-- App Logo Icon -->
            <svg width="32" height="32" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
                <rect width="120" height="120" rx="30" fill="#2563eb"/>
                <path d="M30 85 C 45 85, 45 45, 60 55 C 75 65, 75 35, 90 35" stroke="#22c55e" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
                <circle cx="30" cy="85" r="6" fill="#ffffff"/>
                <circle cx="90" cy="35" r="6" fill="#ef4444"/>
            </svg>
            <span class="text-lg font-bold tracking-wide">Route<span class="text-green-500">Buddy</span></span>
        </div>
        
        <div class="flex items-center space-x-2">
            <!-- Language Selector Dropdown -->
            <select id="langSelect" onchange="changeLanguage()" class="bg-slate-900 text-white text-xs px-2 py-1.5 rounded-lg border border-slate-600 focus:outline-none focus:border-blue-500">
                <option value="en">English</option>
                <option value="hi">हिंदी (Hindi)</option>
                <option value="ur">اردو (Urdu)</option>
                <option value="es">Español (Spanish)</option>
            </select>

            <!-- Share Button -->
            <button onclick="shareApp()" class="bg-blue-600 hover:bg-blue-700 text-white text-xs px-3 py-1.5 rounded-full font-semibold transition">
                🔗 <span id="txt-share">Share</span>
            </button>
        </div>
    </header>

    <!-- Main Content Area -->
    <main class="flex-1 flex flex-col justify-center items-center">
        <div class="bg-slate-800 border border-slate-700 p-3 rounded-2xl shadow-2xl w-full max-w-md">
            
            <!-- Status Badge -->
            <div class="flex justify-between items-center mb-2 px-1">
                <span class="text-xs text-slate-400" id="txt-status-label">Status:</span>
                <span id="status" class="text-xs bg-yellow-500 text-black px-2.5 py-0.5 rounded-full font-bold">Ready</span>
            </div>

            <!-- Search & Destination Box -->
            <div class="mb-3">
                <input type="text" id="destinationInput" placeholder="Where do you want to go?" class="w-full bg-slate-900 text-white p-2.5 rounded-xl border border-slate-700 text-sm mb-2 focus:outline-none focus:border-green-500">
                <button onclick="searchDestination()" class="w-full bg-blue-600 hover:bg-blue-700 text-white py-2 rounded-xl font-semibold text-sm transition shadow-md" id="txt-search-btn">
                    🔍 Find Destination
                </button>
            </div>

            <!-- Map Container -->
            <div id="map" class="mb-3 shadow-inner border border-slate-700"></div>

            <!-- Control Buttons (Tracking Start/Stop) -->
            <button onclick="startTracking()" class="w-full bg-green-600 hover:bg-green-700 text-white py-3 rounded-xl font-bold transition shadow-lg mb-2 text-sm" id="txt-start-btn">
                📍 Start Tracking
            </button>
            <button onclick="stopTracking()" class="w-full bg-red-600 hover:bg-red-700 text-white py-3 rounded-xl font-bold transition shadow-lg mb-2 text-sm" id="txt-stop-btn">
                🛑 Stop Tracking
            </button>
            <button onclick="location.reload()" class="w-full bg-slate-700 hover:bg-slate-600 text-white py-2 rounded-xl font-semibold transition text-xs" id="txt-reset-btn">
                🔄 Reset
            </button>
        </div>
    </main>

    <!-- Footer -->
    <footer class="text-center text-xs text-slate-500 mt-2">
        <p>RouteBuddy © 2026 | Real-time Route Tracker</p>
    </footer>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
    <script>
        // भाषाओं का डेटा (Translations Dictionary)
        const translations = {
            en: {
                share: "Share",
                statusLabel: "Status:",
                statusReady: "Ready",
                statusTracking: "Tracking...",
                statusStopped: "Stopped",
                searchPlaceholder: "Where do you want to go?",
                searchBtn: "🔍 Find Destination",
                startBtn: "📍 Start Tracking",
                stopBtn: "🛑 Stop Tracking",
                resetBtn: "🔄 Reset",
                alertNoQuery: "Please enter a destination name first!",
                alertFound: "Destination found! Red pin shows the location.",
                alertNotFound: "Destination not found, please enter a valid name.",
                alertError: "Error finding destination. Please try again.",
                alertGpsError: "Please allow location access: ",
                alertNoGps: "Your browser does not support Geolocation.",
                alertStopped: "Tracking has been stopped."
            },
            hi: {
                share: "शेयर",
                statusLabel: "स्थिति:",
                statusReady: "तैयार",
                statusTracking: "ट्रैक हो रहा है...",
                statusStopped: "रुक गया",
                searchPlaceholder: "कहाँ जाना है? जगह का नाम लिखें",
                searchBtn: "🔍 रास्ता खोजें",
                startBtn: "📍 ट्रैकिंग शुरू करें",
                stopBtn: "🛑 ट्रैकिंग रोकें",
                resetBtn: "🔄 रीसेट करें",
                alertNoQuery: "कृपया पहले किसी जगह का नाम लिखें!",
                alertFound: "जगह मिल गई है! लाल पिन उस जगह को दिखा रहा है।",
                alertNotFound: "जगह नहीं मिली, कृपया सही नाम लिखें।",
                alertError: "खोजने में कुछ दिक्कत आई। कृपया दोबारा प्रयास करें।",
                alertGpsError: "लोकेशन की अनुमति दें: ",
                alertNoGps: "आपका ब्राउज़र Geolocation को सपोर्ट नहीं करता।",
                alertStopped: "ट्रैकिंग रोक दी गई है।"
            },
            ur: {
                share: "شیئر کریں",
                statusLabel: "حالت:",
                statusReady: "تیار",
                statusTracking: "ٹریکنگ جاری ہے...",
                statusStopped: "رک گیا",
                searchPlaceholder: "کہاں جانا ہے؟ جگہ کا نام لکھیں",
                searchBtn: "🔍 منزل تلاش کریں",
                startBtn: "📍 ٹریکنگ شروع کریں",
                stopBtn: "🛑 ٹریکنگ بند کریں",
                resetBtn: "🔄 ری سیٹ کریں",
                alertNoQuery: "براہ کرم پہلے کسی جگہ کا نام درج کریں!",
                alertFound: "منزل مل گئی ہے! سرخ پن جگہ کو ظاہر کر رہا ہے۔",
                alertNotFound: "منزل نہیں ملی، براہ کرم درست نام درج کریں۔",
                alertError: "تلاش کرنے میں کچھ مسئلہ ہوا۔ دوبارہ کوشش کریں۔",
                alertGpsError: "مقام کی اجازت دیں: ",
                alertNoGps: "آپ کا براؤزر جیو لوکیشن کو سپورٹ نہیں کرتا۔",
                alertStopped: "ٹریکنگ روک دی گئی ہے۔"
            },
            es: {
                share: "Compartir",
                statusLabel: "Estado:",
                statusReady: "Listo",
                statusTracking: "Rastreando...",
                statusStopped: "Detenido",
                searchPlaceholder: "¿A dónde quieres ir?",
                searchBtn: "🔍 Buscar Destino",
                startBtn: "📍 Iniciar Rastreo",
                stopBtn: "🛑 Detener Rastreo",
                resetBtn: "🔄 Reiniciar",
                alertNoQuery: "¡Por favor ingresa un nombre de destino primero!",
                labelFound: "¡Destino encontrado! El pin rojo muestra la ubicación.",
                alertNotFound: "Destino no encontrado, ingresa un nombre válido.",
                alertError: "Error al buscar el destino. Inténtalo de nuevo.",
                alertGpsError: "Permite el acceso a la ubicación: ",
                alertNoGps: "Tu navegador no admite geolocalización.",
                alertStopped: "El rastreo se ha detenido."
            }
        };

        let currentLang = 'en';

        function changeLanguage() {
            currentLang = document.getElementById('langSelect').value;
            const t = translations[currentLang];

            document.getElementById('txt-share').innerText = t.share;
            document.getElementById('txt-status-label').innerText = t.statusLabel;
            document.getElementById('destinationInput').placeholder = t.searchPlaceholder;
            document.getElementById('txt-search-btn').innerText = t.searchBtn;
            document.getElementById('txt-start-btn').innerText = t.startBtn;
            document.getElementById('txt-stop-btn').innerText = t.stopBtn;
            document.getElementById('txt-reset-btn').innerText = t.resetBtn;
            
            const statusEl = document.getElementById('status');
            if(statusEl.innerText.includes("Ready") || statusEl.innerText.includes("तैयार") || statusEl.innerText.includes("تیار") || statusEl.innerText.includes("Listo")) {
                statusEl.innerText = t.statusReady;
            }
        }

        // मैप सेटअप
        const map = L.map('map').setView([28.6139, 77.2090], 15);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
        }).addTo(map);

        let routeLine = L.polyline([], {color: '#22c55e', weight: 6}).addTo(map);
        let watchId = null;
        let userMarker = null;
        let destMarker = null;

        function startTracking() {
            const t = translations[currentLang];
            if (navigator.geolocation) {
                document.getElementById('status').innerText = t.statusTracking;
                document.getElementById('status').className = "text-xs bg-green-500 text-black px-2.5 py-0.5 rounded-full font-bold animate-pulse";
                
                watchId = navigator.geolocation.watchPosition(
                    (pos) => {
                        const lat = pos.coords.latitude;
                        const lng = pos.coords.longitude;
                        const newLatLng = [lat, lng];

                        map.setView(newLatLng, 17);
                        routeLine.addLatLng(newLatLng);

                        if (userMarker) {
                            userMarker.setLatLng(newLatLng);
                        } else {
                            userMarker = L.marker(newLatLng).addTo(map);
                        }
                    },
                    (error) => {
                        alert(t.alertGpsError + error.message);
                    },
                    { enableHighAccuracy: true }
                );
            } else {
                alert(t.alertNoGps);
            }
        }

        function stopTracking() {
            const t = translations[currentLang];
            if (watchId !== null) {
                navigator.geolocation.clearWatch(watchId);
                watchId = null;
                document.getElementById('status').innerText = t.statusStopped;
                document.getElementById('status').className = "text-xs bg-red-500 text-white px-2.5 py-0.5 rounded-full font-bold";
                alert(t.alertStopped);
            }
        }

        function searchDestination() {
            const t = translations[currentLang];
            const query = document.getElementById('destinationInput').value;
            if(!query) {
                alert(t.alertNoQuery);
                return;
            }

            fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query)}`)
                .then(response => response.json())
                .then(data => {
                    if (data && data.length > 0) {
                        const lat = data[0].lat;
                        const lon = data[0].lon;
                        const destLatLng = [lat, lon];

                        map.setView(destLatLng, 15);
                        
                        if (destMarker) {
                            destMarker.setLatLng(destLatLng);
                        } else {
                            destMarker = L.marker(destLatLng, {
                                icon: L.icon({
                                    iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-red.png',
                                    shadowUrl: 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.7.1/images/marker-shadow.png',
                                    iconSize: [25, 41],
                                    iconAnchor: [12, 41],
                                    popupAnchor: [1, -34],
                                    shadowSize: [41, 41]
                                })
                            }).addTo(map);
                        }
                        alert(t.alertFound);
                    } else {
                        alert(t.alertNotFound);
                    }
                })
                .catch(err => {
                    alert(t.alertError);
                });
        }

        function shareApp() {
            if (navigator.share) {
                navigator.share({
                    title: 'RouteBuddy',
                    text: 'Check out my new live route tracker app RouteBuddy!',
                    url: window.location.href,
                }).catch((error) => console.log('Sharing failed', error));
            } else {
                alert("Link: " + window.location.href);
            }
        }
    </script>
</body>
</html>
