<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RouteBuddy - Your Journey, Your Guide</title>
    <link rel="manifest" href="manifest.json">
    <!-- Leaflet Map CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        #map { height: 300px; width: 100%; border-radius: 12px; }
    </style>
</head>
<body class="bg-slate-900 text-white min-h-screen flex flex-col justify-between p-3">

    <!-- Header with Logo, Name & Share Button -->
    <header class="bg-slate-800 border border-slate-700 p-3 rounded-2xl shadow-lg flex justify-between items-center mb-3">
        <div class="flex items-center space-x-3">
            <!-- App Logo Icon -->
            <svg width="34" height="34" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
                <rect width="120" height="120" rx="30" fill="#2563eb"/>
                <path d="M30 85 C 45 85, 45 45, 60 55 C 75 65, 75 35, 90 35" stroke="#22c55e" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
                <circle cx="30" cy="85" r="6" fill="#ffffff"/>
                <circle cx="90" cy="35" r="6" fill="#ef4444"/>
            </svg>
            <span class="text-lg font-bold tracking-wide">Route<span class="text-green-500">Buddy</span></span>
        </div>
        <div class="flex items-center space-x-2">
            <span id="status" class="text-xs bg-yellow-500 text-black px-2.5 py-1 rounded-full font-bold">Ready</span>
            <button onclick="shareApp()" class="bg-blue-600 hover:bg-blue-700 text-white text-xs px-3 py-1.5 rounded-full font-semibold transition">
                🔗 शेयर
            </button>
        </div>
    </header>

    <!-- Main Content Area -->
    <main class="flex-1 flex flex-col justify-center items-center">
        <div class="bg-slate-800 border border-slate-700 p-3 rounded-2xl shadow-2xl w-full max-w-md">
            
            <!-- Search & Destination Box -->
            <div class="mb-3">
                <input type="text" id="destinationInput" placeholder="कहाँ जाना है? (जगह का नाम लिखें)" class="w-full bg-slate-900 text-white p-2.5 rounded-xl border border-slate-700 text-sm mb-2 focus:outline-none focus:border-green-500">
                <button onclick="searchDestination()" class="w-full bg-blue-600 hover:bg-blue-700 text-white py-2 rounded-xl font-semibold text-sm transition shadow-md">
                    🔍 रास्ता खोजें (Find Destination)
                </button>
            </div>

            <!-- Map Container -->
            <div id="map" class="mb-3 shadow-inner border border-slate-700"></div>

            <!-- Control Buttons (Tracking Start/Stop) -->
            <button onclick="startTracking()" class="w-full bg-green-600 hover:bg-green-700 text-white py-3 rounded-xl font-bold transition shadow-lg mb-2 text-sm">
                📍 ट्रैकिंग शुरू करें (Start)
            </button>
            <button onclick="stopTracking()" class="w-full bg-red-600 hover:bg-red-700 text-white py-3 rounded-xl font-bold transition shadow-lg mb-2 text-sm">
                🛑 ट्रैकिंग रोकें (Stop)
            </button>
            <button onclick="location.reload()" class="w-full bg-slate-700 hover:bg-slate-600 text-white py-2 rounded-xl font-semibold transition text-xs">
                🔄 रीसेट करें
            </button>
        </div>
    </main>

    <!-- Footer -->
    <footer class="text-center text-xs text-slate-500 mt-2">
        <p>RouteBuddy © 2026 | Real-time Route Tracker</p>
    </footer>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
    <script>
        // मैप सेट करना
        const map = L.map('map').setView([28.6139, 77.2090], 15);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
        }).addTo(map);

        let routeLine = L.polyline([], {color: '#22c55e', weight: 6}).addTo(map);
        let watchId = null;
        let userMarker = null;
        let destMarker = null;

        function startTracking() {
            if (navigator.geolocation) {
                document.getElementById('status').innerText = "Tracking...";
                document.getElementById('status').className = "text-xs bg-green-500 text-black px-2.5 py-1 rounded-full font-bold animate-pulse";
                
                watchId = navigator.geolocation.watchPosition(
                    (pos) => {
                        const lat = pos.coords.latitude;
                        const lng = pos.coords.longitude;
                        const newLatLng = [lat, lng];

                        map.setView(newLatLng, 17);
                        routeLine.addLatLng(newLatLng);

                        if (userMarker) {
                            userMarker.setLatLng(newLatLng);
                        } else {
                            userMarker = L.marker(newLatLng).addTo(map);
                        }
                    },
                    (error) => {
                        alert("लोकेशन की अनुमति दें: " + error.message);
                    },
                    { enableHighAccuracy: true }
                );
            } else {
                alert("आपका ब्राउज़र Geolocation को सपोर्ट नहीं करता।");
            }
        }

        function stopTracking() {
            if (watchId !== null) {
                navigator.geolocation.clearWatch(watchId);
                watchId = null;
                document.getElementById('status').innerText = "Stopped";
                document.getElementById('status').className = "text-xs bg-red-500 text-white px-2.5 py-1 rounded-full font-bold";
                alert("ट्रैकिंग रोक दी गई है।");
            }
        }

        // जगह खोजने का फंक्शन (Nominatim Free API)
        function searchDestination() {
            const query = document.getElementById('destinationInput').value;
            if(!query) {
                alert("कृपया पहले किसी जगह का नाम लिखें!");
                return;
            }

            fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query)}`)
                .then(response => response.json())
                .then(data => {
                    if (data && data.length > 0) {
                        const lat = data[0].lat;
                        const lon = data[0].lon;
                        const destLatLng = [lat, lon];

                        map.setView(destLatLng, 15);
                        
                        if (destMarker) {
                            destMarker.setLatLng(destLatLng);
                        } else {
                            destMarker = L.marker(destLatLng, {
                                icon: L.icon({
                                    iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-red.png',
                                    shadowUrl: 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.7.1/images/marker-shadow.png',
                                    iconSize: [25, 41],
                                    iconAnchor: [12, 41],
                                    popupAnchor: [1, -34],
                                    shadowSize: [41, 41]
                                })
                            }).addTo(map);
                        }
                        alert("जगह मिल गई है! लाल पिन उस जगह को दिखा रहा है।");
                    } else {
                        alert("जगह नहीं मिली, कृपया सही नाम लिखें।");
                    }
                })
                .catch(err => {
                    alert("खोजने में कुछ दिक्कत आई। कृपया दोबारा प्रयास करें।");
                });
        }

        function shareApp() {
            if (navigator.share) {
                navigator.share({
                    title: 'RouteBuddy',
                    text: 'देखें मेरा नया लाइव रूट ट्रैकर ऐप RouteBuddy! अपनी यात्रा को ट्रैक करने के लिए इसे इस्तेमाल करें:',
                    url: window.location.href,
                }).catch((error) => console.log('Sharing failed', error));
            } else {
                alert("लिंक: " + window.location.href);
            }
        }
    </script>
</body>
</html>
