<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RouteBuddy Live - Fixed Tracking</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        #map { height: 300px; width: 100%; border-radius: 12px; }
        .moving-marker { background: #ffffff; border: 3px solid #2563eb; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 16px; }
    </style>
</head>
<body class="bg-slate-900 text-white p-3">

    <!-- Header -->
    <header class="bg-slate-800 p-4 rounded-2xl mb-4 flex justify-between items-center border border-slate-700">
        <h1 class="text-xl font-bold">
            <span class="text-white">Route</span><span class="text-emerald-400">Buddy</span> 
            <span class="text-[10px] bg-emerald-900 text-emerald-300 px-2 py-0.5 rounded-full border border-emerald-500">LIVE</span>
        </h1>
        <div id="gps-status" class="text-[10px] bg-red-900 text-red-300 px-2 py-1 rounded-full border border-red-500">GPS: Off</div>
    </header>

    <!-- Controls -->
    <div class="bg-slate-800 p-4 rounded-2xl mb-4 border border-slate-700">
        <div id="map" class="mb-4"></div>
        <div class="grid grid-cols-2 gap-4 mb-4">
            <div class="bg-slate-900 p-3 rounded-xl border border-slate-700">
                <p class="text-xs text-slate-400">Distance</p>
                <p id="total-distance" class="text-lg font-bold text-emerald-400">0.00 km</p>
            </div>
            <div class="bg-slate-900 p-3 rounded-xl border border-slate-700">
                <p class="text-xs text-slate-400">Speed</p>
                <p id="current-speed" class="text-lg font-bold text-sky-400">0 km/h</p>
            </div>
        </div>
        
        <div class="flex gap-2">
            <button onclick="startTracking()" class="flex-1 bg-emerald-600 py-3 rounded-xl font-bold">Start</button>
            <button onclick="stopTracking()" class="flex-1 bg-red-600 py-3 rounded-xl font-bold">Stop</button>
        </div>
        <button onclick="resetData()" class="w-full mt-2 text-xs text-slate-500">Reset All Data</button>
    </div>

    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
    <script>
        const map = L.map('map').setView([28.6139, 77.2090], 16);
        L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', { attribution: 'OSM' }).addTo(map);

        let watchId = null;
        let latlngs = [];
        let polyline = L.polyline([], {color: '#10b981', weight: 6}).addTo(map);
        let marker = null;

        function startTracking() {
            if (!navigator.geolocation) return alert("Geolocation not supported");

            document.getElementById('gps-status').innerText = "GPS: Active";
            document.getElementById('gps-status').className = "text-[10px] bg-emerald-900 text-emerald-300 px-2 py-1 rounded-full border border-emerald-500";

            watchId = navigator.geolocation.watchPosition((pos) => {
                const { latitude, longitude, speed } = pos.coords;
                const newPos = [latitude, longitude];

                // Add point to map
                latlngs.push(newPos);
                polyline.setLatLngs(latlngs);
                map.setView(newPos, 17);

                if (!marker) marker = L.marker(newPos).addTo(map);
                else marker.setLatLng(newPos);

                // Update Speed (if available)
                document.getElementById('current-speed').innerText = speed ? (speed * 3.6).toFixed(1) + " km/h" : "0 km/h";
                
                // Save progress
                localStorage.setItem('route_data', JSON.stringify(latlngs));
            }, (err) => {
                alert("Error: " + err.message);
            }, {
                enableHighAccuracy: true,
                timeout: 5000,
                maximumAge: 0
            });
        }

        function stopTracking() {
            if (watchId) navigator.geolocation.clearWatch(watchId);
            document.getElementById('gps-status').innerText = "GPS: Stopped";
            document.getElementById('gps-status').className = "text-[10px] bg-red-900 text-red-300 px-2 py-1 rounded-full border border-red-500";
        }

        function resetData() {
            localStorage.clear();
            location.reload();
        }

        // Load old data
        const saved = localStorage.getItem('route_data');
        if (saved) {
            latlngs = JSON.parse(saved);
            polyline.setLatLngs(latlngs);
            if (latlngs.length > 0) map.setView(latlngs[latlngs.length - 1], 17);
        }
    </script>
</body>
</html>
