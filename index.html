<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <title>RouteBuddy - Live Tracking</title>
    <!-- Leaflet Map CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
    <script src="https://cdn.tailwindcss.com"></script>
    <style>#map { height: 400px; width: 100%; border-radius: 15px; }</style>
</head>
<body class="bg-slate-900 text-white p-4">

    <h1 class="text-2xl font-bold text-center mb-4">Route<span class="text-green-500">Buddy</span></h1>
    
    <!-- Map Container -->
    <div id="map" class="mb-4 shadow-lg border-2 border-slate-700"></div>

    <button onclick="startTracking()" class="w-full bg-green-600 py-3 rounded-xl font-bold mb-2">📍 ट्रैकिंग शुरू करें</button>
    <button onclick="location.reload()" class="w-full bg-slate-700 py-3 rounded-xl font-bold">🔄 रीसेट करें</button>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
    <script>
        // मैप सेट करना
        const map = L.map('map').setView([28.6139, 77.2090], 13); // दिल्ली का लोकेशन
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

        let routeLine = L.polyline([], {color: 'green', weight: 5}).addTo(map);

        function startTracking() {
            navigator.geolocation.watchPosition((pos) => {
                const lat = pos.coords.latitude;
                const lng = pos.coords.longitude;
                const newLatLng = [lat, lng];

                map.setView(newLatLng, 15);
                routeLine.addLatLng(newLatLng);
                L.marker(newLatLng).addTo(map); // जहाँ-जहाँ जाएगा, वहां निशान लगेगा
            }, null, {enableHighAccuracy: true});
        }
    </script>
</body>
</html>
