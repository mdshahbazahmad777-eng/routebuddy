<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RouteBuddy - By Eagle Networks SBZ</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Leaflet CSS & JS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
</head>
<body class="bg-slate-900 text-white h-screen flex flex-col justify-between">

    <!-- Header -->
    <header class="bg-slate-800 border-b border-slate-700 p-4 shadow-md flex justify-between items-center">
        <div class="flex items-center space-x-3">
            <svg width="36" height="36" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
                <rect width="120" height="120" rx="30" fill="#2563eb"/>
                <path d="M30 85 C 45 85, 45 45, 60 55 C 75 65, 75 35, 90 35" stroke="#22c55e" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
                <circle cx="30" cy="85" r="6" fill="#ffffff"/>
                <circle cx="90" cy="35" r="6" fill="#ef4444"/>
            </svg>
            <div>
                <span class="text-lg font-bold tracking-wide">Route<span class="text-green-500">Buddy</span></span>
                <p class="text-[10px] text-slate-400 tracking-wider uppercase font-semibold">Eagle Networks SBZ</p>
            </div>
        </div>
        
        <div class="flex items-center space-x-2">
            <!-- Language Switcher -->
            <select id="langSelect" onchange="changeLanguage()" class="bg-slate-700 text-white text-xs px-2 py-1 rounded border border-slate-600 focus:outline-none">
                <option value="en">English</option>
                <option value="hi">हिंदी</option>
            </select>
            
            <span id="statusBadge" class="text-xs bg-yellow-500 text-black px-2.5 py-1 rounded-full font-bold">Ready</span>
            
            <button onclick="shareApp()" class="bg-blue-600 hover:bg-blue-700 text-white text-xs px-3 py-1.5 rounded-full font-semibold transition">
                🔗 <span data-i18n="share">Share</span>
            </button>
        </div>
    </header>

    <!-- Main Content: Map & Controls -->
    <main class="flex-1 flex flex-col md:flex-row">
        <!-- Sidebar Controls -->
        <div class="w-full md:w-80 bg-slate-800 border-r border-slate-700 p-4 flex flex-col justify-between">
            <div>
                <h2 id="panelTitle" class="text-lg font-bold mb-2">Start Journey</h2>
                <p id="panelDesc" class="text-slate-400 text-sm mb-6">Track your live location and draw your route path automatically.</p>
                
                <button onclick="startTracking()" class="w-full bg-green-600 hover:bg-green-700 text-white py-3 rounded-xl font-bold transition shadow-lg mb-3">
                    📍 <span data-i18n="startBtn">Start Tracking</span>
                </button>
                <button onclick="stopTracking()" class="w-full bg-red-600 hover:bg-red-700 text-white py-3 rounded-xl font-bold transition shadow-lg">
                    🛑 <span data-i18n="stopBtn">Stop Tracking</span>
                </button>
            </div>

            <div class="mt-4 bg-slate-900 p-3 rounded-xl border border-slate-700 text-xs text-slate-400">
                <p><strong class="text-white">Live Status:</strong> <span id="coordText">Waiting for GPS...</span></p>
            </div>
        </div>

        <!-- Map Container -->
        <div class="flex-1 h-full min-h-[300px]">
            <div id="map" class="w-full h-full"></div>
        </div>
    </main>

    <!-- Footer with Eagle Networks SBZ Branding -->
    <footer class="bg-slate-800 border-t border-slate-700 p-2.5 text-center text-xs text-slate-400 flex flex-col sm:flex-row justify-center items-center space-y-1 sm:space-y-0 sm:space-x-4">
        <p>RouteBuddy © 2026</p>
        <span class="hidden sm:inline text-slate-600">|</span>
        <p class="font-bold text-blue-400 tracking-wide">Powered by Eagle Networks SBZ</p>
    </footer>

    <script>
        const langData = {
            en: {
                startBtn: "Start Tracking",
                stopBtn: "Stop Tracking",
                panelTitle: "Start Journey",
                panelDesc: "Track your live location and draw your route path automatically.",
                ready: "Ready",
                tracking: "Tracking...",
                stopped: "Stopped",
                share: "Share"
            },
            hi: {
                startBtn: "ट्रैकिंग शुरू करें",
                stopBtn: "ट्रैकिंग रोकें",
                panelTitle: "सफर शुरू करें",
                panelDesc: "अपनी लाइव लोकेशन ट्रैक करें और अपने रास्ते की लाइन बनाएं।",
                ready: "तैयार",
                tracking: "ट्रैक हो रहा है...",
                stopped: "रुक गया",
                share: "शेयर"
            }
        };

        let currentLang = 'en';

        function changeLanguage() {
            currentLang = document.getElementById('langSelect').value;
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (langData[currentLang][key]) {
                    el.innerText = langData[currentLang][key];
                }
            });
        }

        let map = L.map('map').setView([28.6139, 77.2090], 13);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '© Eagle Networks SBZ'
        }).addTo(map);

        let polyline = L.polyline([], {color: '#22c55e', weight: 5}).addTo(map);
        let marker = null;
        let watchId = null;

        function startTracking() {
            if (navigator.geolocation) {
                const statusBadge = document.getElementById('statusBadge');
                statusBadge.innerText = langData[currentLang].tracking;
                statusBadge.className = "text-xs bg-green-500 text-black px-2.5 py-1 rounded-full font-bold animate-pulse";
                
                let latlngs = [];

                watchId = navigator.geolocation.watchPosition(
                    (position) => {
                        const lat = position.coords.latitude;
                        const lng = position.coords.longitude;
                        
                        document.getElementById('coordText').innerText = `Lat: ${lat.toFixed(4)}, Lng: ${lng.toFixed(4)}`;
                        
                        const currentLatLng = [lat, lng];
                        latlngs.push(currentLatLng);
                        polyline.setLatLngs(latlngs);

                        if (!marker) {
                            marker = L.marker(currentLatLng).addTo(map);
                        } else {
                            marker.setLatLng(currentLatLng);
                        }
                        map.setView(currentLatLng, 16);
                    },
                    (error) => {
                        alert("GPS Error: " + error.message);
                    },
                    { enableHighAccuracy: true }
                );
            } else {
                alert("Geolocation is not supported by your browser.");
            }
        }

        function stopTracking() {
            if (watchId !== null) {
                navigator.geolocation.clearWatch(watchId);
                watchId = null;
                const statusBadge = document.getElementById('statusBadge');
                statusBadge.innerText = langData[currentLang].stopped;
                statusBadge.className = "text-xs bg-red-500 text-white px-2.5 py-1 rounded-full font-bold";
                alert(currentLang === 'hi' ? "ट्रैकिंग रोक दी गई है।" : "Tracking stopped.");
            }
        }

        function shareApp() {
            if (navigator.share) {
                navigator.share({
                    title: 'RouteBuddy - Eagle Networks SBZ',
                    text: 'Check out RouteBuddy by Eagle Networks SBZ - My live GPS route tracker app!',
                    url: window.location.href,
                }).catch((error) => console.log('Sharing failed', error));
            } else {
                alert("Link copied / Share option not available!");
            }
        }
    </script>
</body>
</html>
